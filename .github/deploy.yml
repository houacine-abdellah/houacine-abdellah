name: Deploy portfolio to GitHub Pages

# Builds _site/ from index.html and publishes it to
# https://houacine-abdellah.github.io/ on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, cancelling any in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          set -e
          mkdir -p _site
          cp index.html _site/index.html
          [ -f 404.html ] && cp 404.html _site/404.html || true
          [ -f robots.txt ] && cp robots.txt _site/robots.txt || true
          # .nojekyll keeps GitHub from running Jekyll over the artifact
          touch _site/.nojekyll
          echo "Artifact contents:"
          ls -la _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
